<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Reviews</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f3e7ff 0%, #e6f9ff 50%, #e6fff9 100%);
            padding: 3rem 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h2.main-title {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 3rem;
            background: linear-gradient(to right, #7c3aed, #0d9488);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: bold;
        }

        .review-form-container {
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            margin-bottom: 3rem;
            transition: transform 0.3s ease;
        }

        .review-form-container:hover {
            transform: scale(1.02);
        }

        .form-title {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 1.5rem;
            color: #1f2937;
        }

        .rating-container {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .star-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 2rem;
            color: #d1d5db;
            transition: transform 0.2s ease;
        }

        .star-btn:hover {
            transform: scale(1.1);
        }

        .star-btn.active {
            color: #fbbf24;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #0d9488;
            box-shadow: 0 0 0 2px rgba(13, 148, 136, 0.2);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(to right, #7c3aed, #0d9488);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .alert {
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            background-color: #ecfdf5;
            border: 1px solid #6ee7b7;
            color: #065f46;
            display: none;
        }

        .alert.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-1rem);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .reviews-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            padding: 1rem;
        }

        .review-card {
            background: white;
            border-radius: 0.75rem;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .review-card:hover {
            transform: scale(1.03);
        }

        .review-header {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }

        .avatar {
            width: 2.5rem;
            height: 2.5rem;
            background: #e5e7eb;
            border-radius: 50%;
            margin-right: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar svg {
            width: 1.5rem;
            height: 1.5rem;
            color: #9ca3af;
        }

        .review-info {
            flex: 1;
        }

        .author-name {
            font-weight: 600;
            color: #1f2937;
        }

        .review-date {
            font-size: 0.875rem;
            color: #6b7280;
        }

        .star-rating {
            display: flex;
            gap: 0.25rem;
            margin-bottom: 0.75rem;
        }

        .review-comment {
            color: #4b5563;
            font-style: italic;
            line-height: 1.5;
        }

        @media (max-width: 768px) {
            .reviews-grid {
                grid-template-columns: 1fr;
            }

            .review-form-container,
            .review-card {
                margin: 1rem;
            }
        }
    </style>
    <link rel="stylesheet" href="../home/styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">AMASSAH LODGE</div>
            <ul class="nav-links">
                <li><a href="../home/index.html">Home</a></li>
            </ul>
        </nav>
    </header>
    <div class="container">
        <h1 class="main-title">Guests Reviews</h1>

        <!-- Review Form -->
        <div class="review-form-container">
            <h3 class="form-title">Share Your Experience</h3>
            
            <div class="alert" id="successAlert">
                <strong>Success!</strong> Thank you for sharing your review! It has been posted successfully.
            </div>

            <form id="reviewForm">
                <div class="rating-container">
                    <button type="button" class="star-btn" data-rating="1">★</button>
                    <button type="button" class="star-btn" data-rating="2">★</button>
                    <button type="button" class="star-btn" data-rating="3">★</button>
                    <button type="button" class="star-btn" data-rating="4">★</button>
                    <button type="button" class="star-btn" data-rating="5">★</button>
                </div>

                <div class="input-group">
                    <input type="text" id="nameInput" placeholder="Your Name (optional)" />
                    <textarea id="reviewText" placeholder="Share your thoughts..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">Submit Review</button>
            </form>
        </div>

        <!-- Reviews Display -->
        <h3 class="form-title">What Our Guests Say</h3>
        <div class="reviews-grid" id="reviewsContainer">
            <!-- Sample review - will be populated by JavaScript -->
        </div>
    </div>

    <script>
        // Initial reviews data
        let reviews = [
            {
                id: 1,
                rating: 4,
                comment: "Amazing service! The staff was friendly, and the room was perfect.",
                author: "HEAD OF OPERATIONS",
                date: "October 05, 2024"
            }
        ];

        // DOM Elements
        const starButtons = document.querySelectorAll('.star-btn');
        const reviewForm = document.getElementById('reviewForm');
        const reviewsContainer = document.getElementById('reviewsContainer');
        const successAlert = document.getElementById('successAlert');

        // Current rating state
        let currentRating = 0;

        // Star rating functionality
        starButtons.forEach(button => {
            button.addEventListener('click', () => {
                const rating = parseInt(button.dataset.rating);
                currentRating = rating;
                updateStarRating(rating);
            });

            button.addEventListener('mouseover', () => {
                const rating = parseInt(button.dataset.rating);
                updateStarRating(rating);
            });

            button.addEventListener('mouseout', () => {
                updateStarRating(currentRating);
            });
        });

        function updateStarRating(rating) {
            starButtons.forEach((button, index) => {
                button.classList.toggle('active', index < rating);
            });
        }

        // Form submission
        reviewForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const nameInput = document.getElementById('nameInput');
            const reviewText = document.getElementById('reviewText');

            const newReview = {
                id: reviews.length + 1,
                rating: currentRating,
                comment: reviewText.value,
                author: nameInput.value || 'Anonymous',
                date: new Date().toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: '2-digit'
                })
            };

            reviews.unshift(newReview);
            renderReviews();
            reviewForm.reset();
            currentRating = 0;
            updateStarRating(0);

            // Show success message
            successAlert.classList.add('show');
            setTimeout(() => {
                successAlert.classList.remove('show');
            }, 3000);
        });

        // Render reviews
        function renderReviews() {
            reviewsContainer.innerHTML = reviews.map(review => `
                <div class="review-card">
                    <div class="review-header">
                        <div class="avatar">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="8" r="5"/>
                                <path d="M20 21a8 8 0 10-16 0"/>
                            </svg>
                        </div>
                        <div class="review-info">
                            <div class="author-name">${review.author}</div>
                            <div class="review-date">${review.date}</div>
                        </div>
                    </div>
                    <div class="star-rating">
                        ${Array(5).fill('★').map((star, index) => 
                            `<span style="color: ${index < review.rating ? '#fbbf24' : '#d1d5db'}">${star}</span>`
                        ).join('')}
                    </div>
                    <p class="review-comment">${review.comment}</p>
                </div>
            `).join('');
        }

        // Initial render
        renderReviews();
    </script>
</body>
</html>
